<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveKit Smoke Test</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
        background: #020617;
        color: #e2e8f0;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top, rgba(14, 165, 233, 0.18), transparent 35%),
          linear-gradient(180deg, #0f172a, #020617);
      }

      main {
        max-width: 840px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      p {
        color: #94a3b8;
        line-height: 1.5;
      }

      form {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        margin: 24px 0 16px;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 14px;
      }

      input,
      select,
      button {
        border-radius: 12px;
        border: 1px solid #334155;
        background: rgba(15, 23, 42, 0.9);
        color: inherit;
        padding: 12px 14px;
        font: inherit;
      }

      button {
        cursor: pointer;
        background: #0ea5e9;
        border-color: #0ea5e9;
        color: #082f49;
        font-weight: 700;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .secondary {
        background: transparent;
        color: #cbd5e1;
      }

      .actions {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
      }

      pre {
        white-space: pre-wrap;
        word-break: break-word;
        border-radius: 16px;
        border: 1px solid #1e293b;
        background: rgba(2, 6, 23, 0.9);
        padding: 16px;
        min-height: 320px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>LiveKit Smoke Test</h1>
      <p>
        Teste isolado de conexao: gera token via backend, executa uma unica chamada
        <code>room.connect()</code>, nao publica camera nem microfone, e desconecta.
      </p>

      <form id="smoke-form">
        <label>
          Class ID
          <input id="class-id" name="classId" value="smoke-test-class" />
        </label>
        <label>
          Nome
          <input id="user-name" name="userName" value="Smoke Test Teacher" />
        </label>
        <label>
          Role
          <select id="role" name="role">
            <option value="teacher">teacher</option>
            <option value="student">student</option>
          </select>
        </label>
      </form>

      <div class="actions">
        <button id="run-test" type="button">Executar teste</button>
        <button id="clear-log" type="button" class="secondary">Limpar log</button>
      </div>

      <pre id="log" aria-live="polite"></pre>
    </main>

    <script type="module" src="/src/livekitSmoke.ts"></script>
  </body>
  </html>
